name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # node:sqlite (used at runtime) requires Node 22.13+; Node 20 is not supported.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm audit --audit-level=high

  docker:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: company-pulse:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Container smoke test
        run: |
          docker run -d --name app -p 3100:3100 -e COOKIE_SECURE=0 company-pulse:ci
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3100/api/health; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs app; exit 1; fi
          curl -fsS http://127.0.0.1:3100/ | grep -q 'Company Pulse'
          curl -fsS http://127.0.0.1:3100/api/dashboard | grep -q 'Northstar Systems'
          test "$(docker exec app id -u)" != "0"
          for i in $(seq 1 20); do
            status=$(docker inspect -f '{{.State.Health.Status}}' app)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect -f '{{.State.Health.Status}}' app | grep -q healthy
          docker stop -t 15 app
          docker logs app | grep -q shutdown_complete
